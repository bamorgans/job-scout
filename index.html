<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Job Scout — Freelance Opportunity Radar</title>
<!-- PWA / installable app -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#080D1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Job Scout">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SCOUT DESIGN SYSTEM — glass 2026
   Tokens -> primitives -> components. Everything builds up.
   ============================================================ */
:root{
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-data:'JetBrains Mono',ui-monospace,monospace;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-full:999px;
  --blur:18px; --blur-strong:28px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --ease:cubic-bezier(.32,.72,.24,1);
  --shadow-1:0 1px 2px rgba(5,10,25,.25),0 8px 28px rgba(5,10,25,.22);
  --shadow-2:0 2px 6px rgba(5,10,25,.30),0 18px 50px rgba(5,10,25,.35);
}
:root{
  --bg:#080D1A;
  --bg-grad:radial-gradient(1200px 700px at 85% -10%,rgba(94,84,255,.14),transparent 60%),
            radial-gradient(900px 600px at -10% 20%,rgba(240,190,85,.08),transparent 55%),
            radial-gradient(700px 500px at 60% 110%,rgba(38,132,255,.09),transparent 60%);
  --glass:rgba(23,32,56,.66);
  --glass-strong:rgba(13,19,36,.94);
  --glass-hover:rgba(33,44,74,.78);
  --stroke:rgba(255,255,255,.15);
  --stroke-strong:rgba(255,255,255,.28);
  --ink:#F5F8FE; --ink-dim:#BCC8DD; --ink-faint:#8A98B2;
  --accent:#F0BE55; --accent-soft:rgba(240,190,85,.16); --accent-ink:#241A05;
  --good:#66E0AC; --warn:#F5B072; --bad:#F58C8C;
  color-scheme:dark;
}
body.light{
  --bg:#E7ECF4;
  --bg-grad:radial-gradient(1100px 650px at 85% -10%,rgba(120,110,255,.14),transparent 60%),
            radial-gradient(900px 600px at -10% 25%,rgba(196,148,32,.10),transparent 55%),
            radial-gradient(700px 500px at 60% 110%,rgba(60,140,255,.10),transparent 60%);
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.92);
  --glass-hover:rgba(255,255,255,.82);
  --stroke:rgba(14,23,40,.14);
  --stroke-strong:rgba(14,23,40,.26);
  --ink:#0E1726; --ink-dim:#42506A; --ink-faint:#71809A;
  --accent:#7A5508; --accent-soft:rgba(178,128,22,.14); --accent-ink:#FFF7E4;
  --good:#0E7A53; --warn:#96520F; --bad:#A83636;
  --shadow-1:0 1px 2px rgba(30,45,80,.08),0 8px 28px rgba(30,45,80,.10);
  --shadow-2:0 2px 6px rgba(30,45,80,.10),0 18px 50px rgba(30,45,80,.16);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body);color:var(--ink);background:var(--bg);
  background-image:var(--bg-grad);background-attachment:fixed;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;
}
::selection{background:var(--accent);color:var(--accent-ink)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- primitives ---------- */
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r-lg);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:var(--shadow-1)}
.glass-strong{background:var(--glass-strong);border:1px solid var(--stroke-strong);border-radius:var(--r-lg);
  backdrop-filter:blur(var(--blur-strong));-webkit-backdrop-filter:blur(var(--blur-strong));box-shadow:var(--shadow-2)}
.stack{display:flex;flex-direction:column;gap:var(--sp-4)}
.row{display:flex;align-items:center;gap:var(--sp-2)}
.spread{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.hide{display:none!important}
.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint)}
.mono{font-family:var(--font-data);font-size:.82em;letter-spacing:.01em}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- type ---------- */
.h1{font-family:var(--font-display);font-weight:700;font-size:1.35rem;letter-spacing:-.02em}
.h2{font-family:var(--font-display);font-weight:600;font-size:1.05rem;letter-spacing:-.01em}
.label{font-family:var(--font-data);font-size:.68rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.12em;color:var(--ink-dim)}
.small{font-size:.82rem}

/* ---------- icon ---------- */
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-3px}
.ic-sm{width:15px;height:15px}
.ic-lg{width:22px;height:22px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:var(--r-sm);font-weight:600;font-size:.88rem;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(var(--blur));transition:background .18s var(--ease),transform .12s var(--ease),border-color .18s;
  user-select:none;white-space:nowrap}
.btn:hover{background:var(--glass-hover);border-color:var(--stroke-strong)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.07)}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--glass)}
.btn-icon{padding:10px;border-radius:var(--r-sm)}
.btn-sm{padding:7px 12px;font-size:.8rem;border-radius:10px}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-full);
  font-family:var(--font-data);font-size:.72rem;font-weight:500;
  background:var(--glass);border:1px solid var(--stroke);color:var(--ink-dim)}
.chip-accent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent)}
.chip-btn{cursor:pointer;transition:background .15s}
.chip-btn:hover{background:var(--glass-hover);color:var(--ink)}
.chip-btn.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.badge-status{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-full);
  font-family:var(--font-data);font-size:.7rem;font-weight:600;border:1px solid}
.st-new{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.st-saved{color:#7FB2FF;border-color:rgba(90,140,255,.4);background:rgba(90,140,255,.12)}
.st-applied{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 12%,transparent)}
.st-contacted{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.st-archived{color:var(--ink-faint);border-color:var(--stroke);background:transparent}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.input,.select,.textarea{width:100%;padding:10px 14px;border-radius:var(--r-sm);
  background:var(--glass);border:1px solid var(--stroke);color:var(--ink);
  backdrop-filter:blur(var(--blur));transition:border-color .15s}
.input::placeholder,.textarea::placeholder{color:var(--ink-faint)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent)}
.textarea{resize:vertical;min-height:90px;line-height:1.55}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-dim) 50%),linear-gradient(135deg,var(--ink-dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.searchbar{position:relative}
.searchbar .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none}
.searchbar .input{padding-left:40px}
.btn-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  color:var(--ink-dim);background:var(--glass);border:1px solid var(--stroke)}
.btn-clear:hover{background:var(--glass-hover);color:var(--ink)}
.check{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:none}

/* ---------- fit gauge (signature) ---------- */
.gauge{--v:0;width:52px;height:52px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--stroke) 0);
  display:grid;place-items:center}
.gauge::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--glass-strong);
  backdrop-filter:blur(var(--blur))}
.gauge span{position:relative;font-family:var(--font-data);font-weight:600;font-size:.8rem}
.gauge-sm{width:40px;height:40px}.gauge-sm span{font-size:.68rem}
.gauge.hi{background:conic-gradient(var(--good) calc(var(--v)*1%),var(--stroke) 0)}
.gauge.mid{background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--stroke) 0)}
.gauge.lo{background:conic-gradient(var(--warn) calc(var(--v)*1%),var(--stroke) 0)}

/* ---------- layout ---------- */
.app{max-width:1080px;margin:0 auto;padding:0 var(--sp-4) 110px;min-height:100%}
.topbar{position:sticky;top:0;z-index:600;margin:0 calc(-1*var(--sp-4));padding:12px var(--sp-4);
  display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 55%,transparent);
  backdrop-filter:blur(var(--blur-strong));-webkit-backdrop-filter:blur(var(--blur-strong));
  border-bottom:1px solid var(--stroke)}
.brandmark{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;flex:none}
@media(max-width:480px){
  .topbar{gap:8px}
  .topbar .small{display:none}
  .topbar .btn-icon{padding:8px}
  .brandmark{width:32px;height:32px}
}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:700;display:flex;gap:2px;padding:6px;border-radius:var(--r-full)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 16px;border-radius:var(--r-full);
  font-family:var(--font-data);font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-dim);transition:background .18s,color .18s}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.tab:not(.on):hover{background:var(--glass-hover);color:var(--ink)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:var(--sp-5) 0 var(--sp-4)}

/* ---------- cards & table ---------- */
.card{padding:var(--sp-4);transition:background .18s,border-color .18s}
.card.click{cursor:pointer}
.card.click:hover{background:var(--glass-hover);border-color:var(--stroke-strong)}
.card.sel{border-color:var(--accent);background:var(--accent-soft)}
.list{display:flex;flex-direction:column;gap:10px}
.thead{display:none}
@media(min-width:760px){
  .rowgrid{display:grid;grid-template-columns:34px 56px 1.6fr 1fr .8fr .7fr .9fr;gap:12px;align-items:center}
  .thead{display:grid;padding:0 var(--sp-4);margin-bottom:2px}
  .thead .th{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
  .thead .th:hover{color:var(--ink)}
  .rowgrid-meet{display:grid;grid-template-columns:34px 1.5fr 1fr 1fr .9fr;gap:12px;align-items:center}
}
.sortmark{font-size:.6rem}
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));
  z-index:650;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r-lg);max-width:min(94vw,720px);
  overflow-x:auto;animation:rise .25s var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- map (self-contained SVG — no external tiles) ---------- */
.mapwrap{position:relative;height:300px;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--stroke);box-shadow:var(--shadow-1);
  background:radial-gradient(500px 260px at 50% 40%,var(--accent-soft),transparent 70%),var(--glass)}
#map{height:100%;width:100%}
#map svg{width:100%;height:100%;display:block}
#map .grid{stroke:var(--stroke);stroke-width:1}
#map .mhalo{fill:var(--accent);opacity:.16;transition:opacity .15s}
#map .mdot{fill:var(--accent);stroke:var(--accent-ink);stroke-width:2}
.mpin{cursor:pointer}
.mpin:hover .mhalo,.mpin.on .mhalo{opacity:.4}
.mlabel{fill:var(--ink-dim);font-family:var(--font-data);font-size:10px;paint-order:stroke;
  stroke:var(--glass-strong);stroke-width:3px;stroke-linejoin:round}
#mapcard{position:absolute;left:10px;right:10px;bottom:10px;z-index:20}
.mapempty{height:100%;display:grid;place-items:center;color:var(--ink-dim);font-size:.85rem;text-align:center;padding:0 24px}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,8,20,.55);backdrop-filter:blur(4px);z-index:800;
  opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:850;inset:auto 0 0 0;max-height:88dvh;overflow-y:auto;
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--sp-5) var(--sp-4) calc(var(--sp-6) + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .3s var(--ease)}
.drawer.open{transform:translateY(0)}
@media(min-width:900px){
  .drawer{inset:0 0 0 auto;width:520px;max-height:none;border-radius:var(--r-lg) 0 0 var(--r-lg);
    transform:translateX(102%)}
  .drawer.open{transform:translateX(0)}
}
.grabber{width:44px;height:4px;border-radius:2px;background:var(--stroke-strong);margin:-10px auto 16px}
@media(min-width:900px){.grabber{display:none}}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));z-index:950;
  padding:10px 18px;border-radius:var(--r-sm);font-size:.85rem;font-weight:500;animation:rise2 .25s var(--ease)}
@keyframes rise2{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.skel{border-radius:var(--r-lg);height:86px;background:linear-gradient(100deg,var(--glass) 40%,var(--glass-hover) 50%,var(--glass) 60%);
  background-size:200% 100%;animation:shimmer 1.3s infinite linear;border:1px solid var(--stroke)}
@keyframes shimmer{to{background-position:-200% 0}}
.empty{padding:var(--sp-6) var(--sp-4);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ic{width:34px;height:34px;color:var(--ink-faint);stroke-width:1.5}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:.88rem}
.kv dt{color:var(--ink-dim)}
.divider{height:1px;background:var(--stroke);margin:var(--sp-4) 0;border:none}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.procon{display:grid;gap:10px}
@media(min-width:640px){.procon{grid-template-columns:1fr 1fr}}
.procon ul{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.procon li{display:flex;gap:8px;align-items:flex-start}
.procon li .ic-sm{margin-top:2px}
.settings-grid{display:grid;gap:var(--sp-4)}
@media(min-width:760px){.settings-grid{grid-template-columns:1fr 1fr}}
.stat{padding:12px 16px;text-align:center;flex:1}
.stat b{font-family:var(--font-display);font-size:1.3rem;display:block}
.stat span{font-family:var(--font-data);font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim)}
</style>
</head>
<body>
<div class="app">
  <!-- ===== top bar ===== -->
  <header class="topbar">
    <div class="brandmark"><i data-lucide="radar" class="ic"></i></div>
    <div class="grow">
      <div class="h1">Job Scout</div>
      <div class="small muted" style="margin-top:-3px">Freelance opportunity radar</div>
    </div>
    <button class="btn btn-icon" id="hdrImport" title="Import backup (JSON)" aria-label="Import data">
      <i data-lucide="upload" class="ic"></i></button>
    <button class="btn btn-icon" id="hdrExport" title="Export all app data (JSON)" aria-label="Export data">
      <i data-lucide="download" class="ic"></i></button>
    <button class="btn btn-icon" id="themeBtn" title="Toggle dark / light mode" aria-label="Toggle theme">
      <i data-lucide="sun-moon" class="ic"></i></button>
    <button class="btn btn-icon" id="refreshBtn" title="Scan with live web research" aria-label="Scan">
      <i data-lucide="satellite-dish" class="ic"></i></button>
  </header>

  <!-- ===== global search + saved searches ===== -->
  <div class="row" style="margin-top:14px">
    <div class="searchbar grow">
      <i data-lucide="search" class="ic"></i>
      <input class="input" id="q" placeholder="Search any field — title, company, tech, city, notes..." autocomplete="off">
      <button class="btn-clear hide" id="qClear" title="Clear search" aria-label="Clear search"><i data-lucide="x" class="ic-sm ic"></i></button>
    </div>
    <button class="btn btn-icon" id="saveSearchBtn" title="Save this search" aria-label="Save search">
      <i data-lucide="bookmark-plus" class="ic"></i></button>
  </div>
  <div class="row wrap" id="savedSearches" style="margin-top:10px"></div>

  <main id="view"></main>
</div>

<!-- ===== bottom tabs ===== -->
<nav class="tabbar glass-strong" role="tablist">
  <button class="tab" data-tab="opps" role="tab"><i data-lucide="briefcase-business" class="ic"></i>Jobs</button>
  <button class="tab" data-tab="meetups" role="tab"><i data-lucide="map-pin" class="ic"></i>Meetups</button>
  <button class="tab" data-tab="companies" role="tab"><i data-lucide="building-2" class="ic"></i>Intel</button>
  <button class="tab" data-tab="settings" role="tab"><i data-lucide="sliders-horizontal" class="ic"></i>Setup</button>
</nav>

<!-- ===== bulk action bar ===== -->
<div class="bulkbar glass-strong hide" id="bulkbar"></div>

<!-- ===== drawer ===== -->
<div class="scrim" id="scrim"></div>
<aside class="drawer glass-strong" id="drawer" role="dialog" aria-modal="true"></aside>

<input type="file" id="importFile" accept="application/json" class="hide">

<script>
/* ============================================================
   SCOUT — local-first freelance opportunity radar
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- bundled icon set (lucide path data, inline — no CDN) ---------- */
const ICONS={
  "radar":'<path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62a10 10 0 1 0 19.02-1.27"/><path d="M16.24 7.76a6 6 0 1 0-8.01 8.91"/><path d="M12 18h.01"/><path d="M17.99 11.66a6 6 0 0 1-2.22 4.75"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/>',
  "sun-moon":'<path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/>',

/* ============================================================
   COMMON FETCH ENGINE — one path for every live request.
   Robust JSON extraction, per-request timeout + cancellation,
   guaranteed loading cleanup, graceful failure everywhere.
   ============================================================ */

/* Robust JSON extractor: tolerates prose, citations ([1]), code fences,
   and truncation (recovers a partial array by closing it). */
function extractJSON(text){
  if(!text) throw new Error("Empty response from the model.");
  let s=text.replace(/```json|```/g,"");
  try{return JSON.parse(s.trim())}catch(e){}
  const balanced=(open,close,requireBrace)=>{
    const out=[]; let depth=0,start=-1,inStr=false,esc=false;
    for(let i=0;i<s.length;i++){const c=s[i];
      if(inStr){ if(esc)esc=false; else if(c==="\\")esc=true; else if(c==='"')inStr=false; continue; }
      if(c==='"'){inStr=true;continue;}
      if(c===open){ if(depth===0)start=i; depth++; }
      else if(c===close && depth>0){ depth--; if(depth===0&&start>=0){ const sub=s.slice(start,i+1);
        if(requireBrace && sub.indexOf("{")<0) continue;   // skip primitive arrays like [1] or citations
        try{out.push(JSON.parse(sub))}catch(_){} } }
    }
    return out;
  };
  // 1) real list payloads: balanced arrays that contain objects (largest wins)
  const arrs=balanced("[","]",true);
  if(arrs.length) return arrs.sort((a,b)=>b.length-a.length)[0];
  // 2) truncation repair: first [ … last complete } then close the array
  const a=s.indexOf("["), lastObj=s.lastIndexOf("}");
  if(a>=0 && lastObj>a){ const cand=s.slice(a,lastObj+1)+"]"; if(cand.indexOf("{")>=0){ try{return JSON.parse(cand)}catch(e){} } }
  // 3) object payloads (company research): richest object wins
  const objs=balanced("{","}",false);
  if(objs.length) return objs.sort((a,b)=>Object.keys(b).length-Object.keys(a).length)[0];
  throw new Error("Couldn't read the results (model returned no valid JSON).");
}

/* Friendly message for a connection that isn't wired up. */
function connErr(){
  if(!window.storage && !state.settings.apiKey && !state.settings.proxyUrl)
    return "No live connection set. Add your API key or proxy URL in Setup.";
  return "Network blocked (CORS or offline). Check your key / proxy URL in Setup.";
}
const humanErr=e=>e&&e.message?e.message:"Something went wrong.";

/* Single low-level call. Uses the caller's AbortSignal; never manages UI. */
async function callClaude(prompt,maxTokens,signal){
  const url=state.settings.proxyUrl?.trim() || "https://api.anthropic.com/v1/messages";
  const headers={"Content-Type":"application/json"};
  const key=state.settings.apiKey?.trim();
  if(key && !state.settings.proxyUrl){
    headers["x-api-key"]=key;
    headers["anthropic-version"]="2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"]="true";
  }
  const body={model:"claude-sonnet-4-6",max_tokens:maxTokens,
    messages:[{role:"user",content:prompt}],
    tools:[{type:"web_search_20250305",name:"web_search",max_uses:6}]};
  let res;
  try{
    res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body),signal});
  }catch(e){
    if(e.name==="AbortError") throw e;      // handled upstream
    throw new Error(connErr());             // TypeError = CORS/offline
  }
  if(!res.ok){
    let m="Request failed ("+res.status+")";
    try{const j=await res.json(); m=j&&j.error&&j.error.message?j.error.message:m;}catch(_){}
    throw new Error(m);
  }
  const data=await res.json();
  if(data.error) throw new Error(data.error.message||"API error");
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  return extractJSON(text);
}

/* Guarded call: owns the AbortController + timeout, aborts any prior request
   of the same kind, and always cleans up. Returns parsed JSON or throws. */
async function guardedCall(key,prompt,maxTokens,timeoutMs){
  try{ state.controllers[key]&&state.controllers[key].abort("restart"); }catch(_){}
  const ctrl=new AbortController(); state.controllers[key]=ctrl;
  const timer=setTimeout(()=>{ctrl._timeout=true; try{ctrl.abort("timeout")}catch(_){}}, timeoutMs);
  try{
    return await callClaude(prompt,maxTokens,ctrl.signal);
  }catch(err){
    if(err.name==="AbortError"){
      if(ctrl._timeout) throw new Error("Timed out — the search took too long. Try again.");
      const e=new Error("cancelled"); e.cancelled=true; throw e;   // superseded by a newer request
    }
    throw err;
  }finally{
    clearTimeout(timer);
    if(state.controllers[key]===ctrl) state.controllers[key]=null;
  }
}

/* Wrap a scan tab's work with loading + error UI. Never leaves loading stuck. */
async function runScan(key,work){
  state.loading[key]=true; state.errors[key]=null; render();
  try{
    await work();
  }catch(err){
    if(err.cancelled){ return; }            // a newer scan took over; stay quiet
    state.errors[key]=humanErr(err); toast(state.errors[key]);
  }finally{
    state.loading[key]=false; render();
  }
}

/* ---------- map (self-contained SVG projection) ---------- */
function initMap(){
  const el=$("#map"); if(!el)return;
  const pts=state.data.meetups.filter(m=>isFinite(+m.lat)&&isFinite(+m.lng)&&+m.lat&&+m.lng);
  if(!pts.length){
    el.innerHTML=`<div class="mapempty">No plotted events yet — scan to map meetups near ${esc(state.settings.location)}</div>`;
    return;
  }
  const W=el.clientWidth||360, H=el.clientHeight||300, P=46;
  let minLa=Math.min(...pts.map(p=>+p.lat)), maxLa=Math.max(...pts.map(p=>+p.lat));
  let minLo=Math.min(...pts.map(p=>+p.lng)), maxLo=Math.max(...pts.map(p=>+p.lng));
  if(maxLa-minLa<0.06){minLa-=0.06;maxLa+=0.06}
  if(maxLo-minLo<0.06){minLo-=0.06;maxLo+=0.06}
  const X=lo=>P+( +lo-minLo)/(maxLo-minLo)*(W-2*P);
  const Y=la=>H-P-(+la-minLa)/(maxLa-minLa)*(H-2*P);
  let grid="";
  for(let i=1;i<7;i++){const x=W/7*i, y=H/7*i;
    grid+=`<line class="grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/><line class="grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;}
  const pins=pts.map(p=>`
    <g class="mpin" data-pin="${p.id}" transform="translate(${X(p.lng).toFixed(1)},${Y(p.lat).toFixed(1)})">
      <circle r="15" class="mhalo"/><circle r="6" class="mdot"/>
      <text y="-13" text-anchor="middle" class="mlabel">${esc((p.name||"").length>24?(p.name).slice(0,23)+"…":p.name)}</text>
    </g>`).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Meetup map">${grid}${pins}</svg><div id="mapcard"></div>`;
  el.querySelectorAll(".mpin").forEach(pn=>pn.addEventListener("click",()=>{
    el.querySelectorAll(".mpin").forEach(x=>x.classList.remove("on")); pn.classList.add("on");
    const m=pts.find(x=>x.id===pn.dataset.pin); if(!m)return;
    $("#mapcard").innerHTML=`<div class="glass-strong" style="padding:12px 14px;border-radius:var(--r-md)">
      <div class="spread"><div>
        <div style="font-weight:600">${esc(m.name)}</div>
        <div class="small muted">${esc(m.date||"")} ${esc(m.time||"")} · ${esc(m.venue||"")}</div>
        <div class="small faint">${esc(m.address||"")}</div></div>
      <div class="row">
        ${m.url?`<a class="btn btn-sm" href="${esc(m.url)}" target="_blank" rel="noopener">${icSvg("external-link","ic-sm ic")}Open</a>`:""}
        <button class="btn btn-icon btn-ghost btn-sm" id="mapcardClose">${icSvg("x","ic-sm ic")}</button>
      </div></div></div>`;
    $("#mapcardClose").onclick=()=>{$("#mapcard").innerHTML="";pn.classList.remove("on");};
  }));
}

    <button class="btn btn-icon btn-ghost" data-close><i data-lucide="x" class="ic"></i></button></div>
  <div class="stack" style="margin-top:8px">
    <div class="field"><span class="label">Role title</span><input class="input" id="addTitle" placeholder="e.g. Senior React Native Engineer"></div>
    <div class="field"><span class="label">Company</span><input class="input" id="addCompany" placeholder="Company name"></div>
    <div class="row" style="gap:10px">
      <div class="field grow"><span class="label">Type</span>
        <select class="select" id="addType">${["contract","freelance","full-time","fractional"].map(t=>`<option>${t}</option>`).join("")}</select></div>
      <div class="field grow"><span class="label">Rate</span><input class="input" id="addRate" placeholder="$150/hr"></div>
    </div>
    <div class="row" style="gap:10px">
      <div class="field grow"><span class="label">Location</span><input class="input" id="addLoc" placeholder="Remote / San Jose"></div>
      <div class="field grow"><span class="label">Posted</span><input class="input" id="addPosted" placeholder="today / 2026-08-12"></div>
    </div>
    <div class="field"><span class="label">Listing URL</span><input class="input" id="addUrl" placeholder="https://…"></div>
    <div class="field"><span class="label">Hiring manager</span><input class="input" id="addHM" placeholder="Name (optional)"></div>
    <div class="field"><span class="label">Hiring manager LinkedIn</span><input class="input" id="addHMln" placeholder="https://linkedin.com/in/… (optional)"></div>
    <div class="field"><span class="label">Skills (comma-separated)</span><input class="input" id="addSkills" placeholder="React Native, TypeScript, Video"></div>
    <div class="field"><span class="label">Fit score (0–100)</span><input class="input" id="addFit" type="number" min="0" max="100" placeholder="75"></div>
    <div class="field"><span class="label">Notes</span><textarea class="textarea" id="addNotes" placeholder="Why it fits, contacts, next steps…"></textarea></div>
    <div class="row"><button class="btn btn-primary" id="addSave"><i data-lucide="check" class="ic"></i>Add to tracker</button></div>
  </div>`;
}
function openAddJob(){
  openDrawer(addJobHTML());
  $("#addSave").onclick=async()=>{
    const title=$("#addTitle").value.trim(), company=$("#addCompany").value.trim();
    if(!title&&!company){toast("Add at least a title or company");return}
    const fit=parseInt($("#addFit").value,10);
    state.data.jobs.unshift({id:uid(),status:"new",added:Date.now(),
      title:title||"(untitled)", company:company||"", type:$("#addType").value,
      rate:$("#addRate").value.trim(), location:$("#addLoc").value.trim(),
      posted:$("#addPosted").value.trim(), url:$("#addUrl").value.trim(),
      hiringManager:$("#addHM").value.trim(), hiringManagerLinkedin:$("#addHMln").value.trim(),
      skills:$("#addSkills").value.split(",").map(s=>s.trim()).filter(Boolean),
      fitScore:isFinite(fit)?Math.max(0,Math.min(100,fit)):0,
      fitReason:"Added manually", summary:"", source:"manual", notes:$("#addNotes").value.trim()});
    await save(); closeDrawer(); toast("Added to tracker"); render();
  };
}

/* ---------- root render ---------- */
function render(){
  $$(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===state.tab));
  const v=$("#view");
  v.innerHTML=state.tab==="opps"?viewOpps():state.tab==="meetups"?viewMeetups()
    :state.tab==="companies"?viewCompanies():viewSettings();
  icons(); bulkbar(); renderSavedSearches();
  if(state.tab==="meetups") initMap();

  /* wire view events */
  $("#scanJobs")&&($("#scanJobs").onclick=scanJobs);
  $("#scanJobs2")&&($("#scanJobs2").onclick=scanJobs);
  $("#addJob")&&($("#addJob").onclick=openAddJob);
  $("#addJobHead")&&($("#addJobHead").onclick=openAddJob);
  $("#clearSearchInline")&&($("#clearSearchInline").onclick=()=>{state.q="";$("#q").value="";syncSearchUI();render();});
  $("#scanMeetups")&&($("#scanMeetups").onclick=scanMeetups);
  $("#scanMeetups2")&&($("#scanMeetups2").onclick=scanMeetups);
  $("#selAll")&&($("#selAll").onclick=()=>{
    const rows=state.data.jobs.filter(matches);
    const all=rows.every(j=>state.selected.has(j.id));
    rows.forEach(j=>all?state.selected.delete(j.id):state.selected.add(j.id)); render();});
  $("#intelGo")&&($("#intelGo").onclick=()=>{const n=$("#intelName").value.trim(); if(n)researchCompany(n);});
  $("#saveSettings")&&($("#saveSettings").onclick=async()=>{
    Object.assign(state.settings,{location:$("#setLoc").value,profile:$("#setProfile").value,
      email:$("#setEmail").value,emailTpl:$("#setTpl").value,
      apiKey:$("#setKey").value.trim(),proxyUrl:$("#setProxy").value.trim(),
      freshHours:+$("#setFresh").value});
    await saveSettings(); toast("Settings saved");});
  $("#exportAll")&&($("#exportAll").onclick=exportAll);
  $("#importBtn")&&($("#importBtn").onclick=()=>$("#importFile").click());
  $("#wipe")&&($("#wipe").onclick=async()=>{
    if(!confirm("Clear all cached jobs, meetups, and company intel? This resets your tracked, strong-fit and in-play counts."))return;
    Object.values(state.controllers).forEach(c=>{try{c&&c.abort("wipe")}catch(_){}});
    state.controllers={opps:null,meetups:null,company:null};
    state.loading={opps:false,meetups:false,company:false};
    state.errors={opps:null,meetups:null,company:null};
    state.data={jobs:[],meetups:[],companies:[],meta:{jobsScan:0,meetupsScan:0}};
    state.selected.clear(); state.lastCompany=""; state.q=""; $("#q").value="";
    await save(); render(); toast("All data cleared");});

  v.querySelectorAll("[data-sort]").forEach(el=>el.onclick=()=>{const[k,f]=el.dataset.sort.split(":");setSort(k,f)});
  v.querySelectorAll("[data-sel]").forEach(el=>el.onclick=e=>{e.stopPropagation();
    const id=el.dataset.sel; 
    if(state.selected.has(id)){state.selected.delete(id);} else {state.selected.add(id);
      const j=state.data.jobs.find(x=>x.id===id); if(j)state.lastCompany=j.company||"";}
    render();});
  v.querySelectorAll("[data-open]").forEach(el=>el.onclick=e=>{
    if(e.target.closest("[data-sel],[data-mail],[data-intel]"))return;
    const j=state.data.jobs.find(x=>x.id===el.dataset.open); if(!j)return;
    state.lastCompany=j.company||""; state.editing=j; openDrawer(jobHTML(j));});
  v.querySelectorAll("[data-mail]").forEach(el=>el.onclick=e=>{e.stopPropagation();
    const j=state.data.jobs.find(x=>x.id===el.dataset.mail); if(j)emailJob(j);});
  v.querySelectorAll("[data-intel]").forEach(el=>el.onclick=e=>{e.stopPropagation();
    researchCompany(el.dataset.intel,el.dataset.job);});
  v.querySelectorAll("[data-comp]").forEach(el=>el.onclick=e=>{
    if(e.target.closest("[data-delcomp]"))return;
    const c=state.data.companies.find(x=>x.id===el.dataset.comp); if(c)openDrawer(companyHTML(c));});
  v.querySelectorAll("[data-delcomp]").forEach(el=>el.onclick=async e=>{e.stopPropagation();
    state.data.companies=state.data.companies.filter(x=>x.id!==el.dataset.delcomp); await save(); render();});
  v.querySelectorAll("[data-delmeet]").forEach(el=>el.onclick=async()=>{
    state.data.meetups=state.data.meetups.filter(x=>x.id!==el.dataset.delmeet); await save(); render();});
}

/* ---------- global wiring ---------- */
$$(".tab").forEach(t=>t.onclick=()=>{state.tab=t.dataset.tab;state.selected.clear();render();
  if(state.tab==="meetups"&&!state.data.meetups.length&&!isFresh("meetupsScan")&&!state.loading.meetups) scanMeetups();});
function syncSearchUI(){$("#qClear")&&$("#qClear").classList.toggle("hide",!state.q);}
$("#q").addEventListener("input",e=>{state.q=e.target.value;syncSearchUI();render();});
$("#qClear").onclick=()=>{state.q="";$("#q").value="";syncSearchUI();$("#q").focus();render();};
$("#refreshBtn").onclick=()=>state.tab==="meetups"?scanMeetups():scanJobs();
$("#hdrExport").onclick=exportAll;
$("#hdrImport").onclick=()=>$("#importFile").click();

/* ---------- boot: local-first, look at cache first, refetch only if stale ---------- */
(async()=>{
  await load(); applyTheme(); render(); renderSavedSearches(); syncSearchUI();
  const canCallApi = window.storage || state.settings.apiKey || state.settings.proxyUrl;
  if(canCallApi && !state.data.jobs.length && !isFresh("jobsScan")) scanJobs();
})();

/* ---------- PWA: register service worker for install + offline (hosted https only) ---------- */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
